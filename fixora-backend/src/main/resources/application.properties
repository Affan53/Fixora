spring.application.name=fixora-backend

# --- Database (Postgres) ---
# Point these at your Neon/Supabase/Render Postgres instance
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fixora}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# Generate a real random secret for production, e.g.: openssl rand -base64 48
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-in-production-please}
jwt.expiration-days=30

# --- Fast2SMS ---
# Get this from https://www.fast2sms.com/dashboard/dev-api after signing up
fast2sms.api-key=${FAST2SMS_API_KEY:}

# --- Firebase (push notifications only — separate from any phone auth) ---
# Path to the service account JSON key file downloaded from Firebase Console.
# See README for setup steps. Leave unset to disable push (safe for local dev).
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# --- CORS ---
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# --- Server ---
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
